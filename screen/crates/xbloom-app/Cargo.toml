[package]
name = "xbloom-app"
description = "The xBloom screen's application layer: settings, PIN lock, recipe/history/preset/media stores, the machine controller thread and the platform-agnostic admin HTTP API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
xbloom-core = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
serde_norway = "0.9"
log = { workspace = true }
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
getrandom = "0.4"
zune-jpeg = "0.4"   # SIMD paths are arch-gated, so this is fine on Xtensa too

[build-dependencies]
flate2 = "1"

[dev-dependencies]
tempfile = "3"
jpeg-encoder = "0.6"
