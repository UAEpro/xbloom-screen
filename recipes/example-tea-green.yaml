# Example tea: a green tea (sencha style) through the dripper, grinder off. Put about
# 4 g of leaves in a paper filter. 250 ml in total (60 + 95 + 95) at 80 °C.
# dose_g is 10 only so the brew ratio fits the machine's 1:25.5 maximum: with grind 0
# nothing is ground, so the dose is bookkeeping.
name: Green Tea
dose_g: 10
grind: 0
kind: tea
dripper: Omni
water_ml: 250
note: About 4 g of green tea leaves in a paper filter. Cooler water keeps it sweet. The grinder stays off.
pours:
  - {label: Wake,    ml: 60, temp_c: 80, pattern: center, pause_s: 30, rpm: 0, flow_ml_s: 3.0}
  - {label: Steep 1, ml: 95, temp_c: 80, pattern: center, pause_s: 45, rpm: 0, flow_ml_s: 3.0}
  - {label: Steep 2, ml: 95, temp_c: 80, pattern: center, pause_s: 30, rpm: 0, flow_ml_s: 3.0}
